<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一问 · AI 聊天</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="page-header">
      <div>
        <p class="eyebrow">一个问题，一次探索</p>
        <h1>一问<span> / AI 聊天</span></h1>
      </div>
      <span class="status">本地聊天</span>
    </header>

    <section class="conversation" aria-labelledby="history-heading">
      <div class="section-heading">
        <h2 id="history-heading">聊天记录</h2>
        <span>从好奇开始</span>
      </div>
      <div id="messages" aria-live="polite">
        <p class="empty-state">正在加载聊天记录……</p>
      </div>
    </section>

    <section class="composer" aria-labelledby="input-label">
      <label id="input-label" for="message-input">想问些什么？</label>
      <textarea id="message-input" rows="3" placeholder="在这里写下你的问题……"></textarea>
      <div class="composer-footer">
        <p id="feedback" role="status">当前使用固定回复，记录在服务重启后清空。</p>
        <button id="send-button" type="button" class="send-button">发送消息 <span aria-hidden="true">↗</span></button>
      </div>
    </section>
    <footer class="page-footer">一问一答，慢慢理解。</footer>
  </main>
</body>
</html>
