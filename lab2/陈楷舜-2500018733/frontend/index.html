<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊一聊 · AI 聊天</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">聊</span>
          <div>
            <p class="eyebrow">AI 聊天</p>
            <h1>聊一聊</h1>
          </div>
        </div>
        <span class="preview-badge">DeepSeek 对话</span>
      </header>

      <section class="chat-panel" aria-labelledby="chat-heading">
        <div class="panel-heading">
          <div>
            <h2 id="chat-heading">从一个问题开始</h2>
            <p>在这里提问、阅读回答，整理你的思路。</p>
          </div>
          <div class="list-tools">
            <span id="record-count" class="section-label">聊天记录</span>
            <button id="reload-button" class="text-button" type="button">刷新列表</button>
          </div>
        </div>

        <p id="status-message" class="status-message" role="status" aria-atomic="true"></p>
        <div id="message-list" class="message-list" aria-live="polite">
          <p class="empty-state">正在加载聊天记录…</p>
        </div>
        <noscript><p class="status-message is-error">请启用 JavaScript 后使用聊天功能。</p></noscript>

        <form id="message-form" class="composer" aria-labelledby="composer-heading" novalidate>
          <label id="composer-heading" for="message-input">写下你的问题</label>
          <textarea
            id="message-input"
            name="message"
            rows="3"
            maxlength="4000"
            placeholder="有什么想聊的？"
            aria-describedby="composer-help"
            required
            disabled
          ></textarea>
          <div class="composer-footer">
            <p id="composer-help">最多 4000 字；每次提问独立作答。</p>
            <button id="send-button" class="send-button" type="submit" disabled>发送消息 <span aria-hidden="true">↗</span></button>
          </div>
        </form>
      </section>

      <footer class="app-footer">聊天记录会自动保存，刷新页面或重启服务后仍可查看。</footer>
    </main>
  </body>
</html>
