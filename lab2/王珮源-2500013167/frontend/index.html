<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 聊天</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat-app">
    <header class="chat-header">
      <h1>AI 聊天</h1>
      <p class="chat-subtitle">和 DeepSeek 模型对话，聊天记录可以修改和删除</p>
    </header>

    <section class="chat-window" id="chat-window" aria-live="polite">
      <!-- 示例记录：只为展示一条聊天记录的排版，按钮还没有交互逻辑 -->
      <article class="message" data-id="0">
        <div class="bubbles">
          <div class="user-block">
            <p class="bubble bubble-user"><span class="role">我</span>你好，请用一句话介绍你自己。</p>
            <div class="message-actions">
              <button type="button" class="action-link" data-action="edit">修改</button>
              <button type="button" class="action-link" data-action="delete">删除</button>
            </div>
          </div>
          <p class="bubble bubble-ai"><span class="role">AI</span>示例回复：这一阶段还没有接入后端，所以这里是一条占位内容。</p>
        </div>
      </article>
    </section>

    <form class="chat-input" id="chat-form" autocomplete="off">
      <label class="visually-hidden" for="message-input">消息输入框</label>
      <textarea
        id="message-input"
        rows="2"
        placeholder="输入消息后按 Enter 发送，Shift+Enter 换行"
      ></textarea>
      <div class="chat-input-actions">
        <span class="status-text" id="status-text" role="status" aria-live="polite"></span>
        <button type="submit" class="btn btn-send" id="send-button">发送</button>
      </div>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
