<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 聊天</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>AI 聊天</h1>
      <p class="app-subtitle">每一轮问答都会成为一条聊天记录</p>
    </header>

    <main class="chat-list" id="chat-list">
      <!-- 聊天记录由 app.js 通过 /api/messages 加载后渲染到这里 -->
      <p class="empty-state" id="empty-state">还没有聊天记录，在下面输入一句话试试。</p>
    </main>

    <!-- 页面内的状态与错误提示区域，后续替代 alert() 之类的弹窗 -->
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <footer class="composer">
      <textarea
        class="composer-input"
        id="message-input"
        rows="2"
        placeholder="输入你的问题，按发送添加一条聊天记录"
      ></textarea>
      <button type="button" class="btn btn-primary btn-send" id="send-button">发送</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
