<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 聊天</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>AI 聊天</h1>
      <p class="app-subtitle">每一轮问答都会成为一条聊天记录</p>
    </header>

    <main class="chat-list" id="chat-list">
      <!--
        下面两条是用于查看页面结构的静态示例记录。
        后续阶段会改由 app.js 通过后端 API 加载和渲染真实记录。
      -->

      <article class="message" data-id="1">
        <div class="bubble bubble-user">
          <p class="bubble-text">你好，帮我用一句话介绍北京大学。</p>
        </div>
        <div class="bubble bubble-reply">
          <p class="bubble-text">北京大学是中国历史最悠久的现代综合性大学之一。</p>
        </div>
        <div class="message-actions">
          <button type="button" class="btn btn-edit">修改</button>
          <button type="button" class="btn btn-delete">删除</button>
        </div>
      </article>

      <article class="message message-editing" data-id="2">
        <div class="bubble bubble-user">
          <p class="bubble-text">今天适合做什么？</p>
        </div>
        <div class="bubble bubble-reply">
          <p class="bubble-text">可以出去走走，也可以读读书。</p>
        </div>

        <!-- 页面内联编辑区：不使用 prompt()，修改内容直接在页面里输入 -->
        <div class="edit-area">
          <label class="edit-label" for="edit-input-2">修改这条提问</label>
          <textarea id="edit-input-2" class="edit-input" rows="2">今天适合做什么？</textarea>
          <div class="edit-actions">
            <button type="button" class="btn btn-primary">保存</button>
            <button type="button" class="btn btn-cancel">取消</button>
          </div>
        </div>

        <div class="message-actions">
          <button type="button" class="btn btn-edit" disabled>修改</button>
          <button type="button" class="btn btn-delete">删除</button>
        </div>
      </article>
    </main>

    <!-- 页面内的状态与错误提示区域，后续替代 alert() 之类的弹窗 -->
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <footer class="composer">
      <textarea
        class="composer-input"
        id="message-input"
        rows="2"
        placeholder="输入你的问题，按发送添加一条聊天记录"
      ></textarea>
      <button type="button" class="btn btn-primary btn-send" id="send-button">发送</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
