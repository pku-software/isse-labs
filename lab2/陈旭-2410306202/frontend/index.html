<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 聊天</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>AI 聊天</h1>
      <p class="app-subtitle">每个会话单独保存自己的多轮对话</p>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2 class="sidebar-title">会话</h2>
          <button type="button" class="btn btn-primary" id="new-conversation-button">新建</button>
        </div>
        <ul class="conversation-list" id="conversation-list"></ul>
        <p class="sidebar-empty" id="sidebar-empty">还没有会话，点“新建”开始。</p>
      </aside>

      <section class="chat-panel">
        <div class="chat-head">
          <div class="title-area" id="title-area">
            <h2 class="chat-title" id="conversation-title">未选择会话</h2>
          </div>
          <div class="chat-head-actions">
            <button type="button" class="btn" id="rename-conversation-button" disabled>重命名</button>
            <button type="button" class="btn btn-danger" id="delete-conversation-button" disabled>删除会话</button>
          </div>
        </div>

        <!-- 会话级别的确认操作显示在这里，不使用 confirm() 之类的弹窗 -->
        <div class="chat-head-extra" id="chat-head-extra"></div>

        <main class="chat-list" id="chat-list">
          <!-- 问答内容由 app.js 通过会话接口加载后渲染到这里 -->
          <p class="empty-state" id="empty-state">先新建或选择一个会话。</p>
        </main>

        <!-- 页面内的状态与错误提示区域，替代 alert() 之类的弹窗 -->
        <p class="status" id="status" role="status" aria-live="polite"></p>

        <footer class="composer">
          <textarea
            class="composer-input"
            id="message-input"
            rows="2"
            placeholder="先新建或选择一个会话"
            disabled
          ></textarea>
          <button type="button" class="btn btn-primary btn-send" id="send-button" disabled>发送</button>
        </footer>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
