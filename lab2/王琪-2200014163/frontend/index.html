<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>AI 聊天</h1>
    </header>

    <div id="messages" class="messages">
      <div class="message">
        <div class="bubble user-bubble">你好，请介绍一下自己</div>
        <div class="bubble reply-bubble">你好！我是一个 AI 助手。</div>
        <div class="message-actions">
          <button type="button" class="edit-button">修改</button>
          <button type="button" class="delete-button">删除</button>
        </div>
      </div>

      <div class="message">
        <div class="bubble user-bubble">今天天气怎么样？</div>
        <div class="bubble reply-bubble">抱歉，我暂时无法获取实时天气。</div>
        <div class="message-actions">
          <button type="button" class="edit-button">修改</button>
          <button type="button" class="delete-button">删除</button>
        </div>
      </div>
    </div>

    <form id="message-form" class="composer">
      <input type="text" id="message-input" class="message-input" placeholder="输入消息..." autocomplete="off">
      <button type="submit" id="send-button" class="send-button">发送</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
