<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 聊天助手</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="chat-app">
      <header class="app-header">
        <div>
          <p class="eyebrow">AI CHAT</p>
          <h1>AI 聊天助手</h1>
        </div>
        <span class="status-badge">本地服务</span>
      </header>

      <section class="chat-panel" aria-label="聊天记录">
        <div class="message-list" id="message-list" aria-live="polite"></div>

        <p class="feedback" id="feedback" role="status"></p>

        <form class="composer" id="message-form">
          <label for="message-input">输入消息</label>
          <div class="composer-row">
            <textarea
              id="message-input"
              name="message"
              rows="3"
              placeholder="输入你想说的内容……"
              required
            ></textarea>
            <button type="submit" class="primary-button">发送</button>
          </div>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
