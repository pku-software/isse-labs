<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>AI 聊天</h1>
      <p class="app-subtitle">本页目前只有界面结构，还没有真实交互。</p>
    </header>

    <main id="message-list" class="message-list" aria-live="polite">
      <!-- 聊天记录由 frontend/app.js 渲染 -->
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <input
        id="message-input"
        class="message-input"
        type="text"
        placeholder="输入消息…"
      >
      <button id="send-button" class="button button-primary" type="submit">发送</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
