<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天助手</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="chat-app">
      <header class="app-header">
        <div>
          <p class="eyebrow">AI CHAT</p>
          <h1>AI 聊天助手</h1>
          <p class="subtitle">一个简洁的对话空间</p>
        </div>
        <span class="status-badge">服务已连接</span>
      </header>

      <section id="message-list" class="message-list" aria-label="聊天记录">
        <p class="empty-state">正在加载聊天记录……</p>
      </section>

      <form id="message-form" class="composer" aria-label="发送消息">
        <label for="message-input">输入消息</label>
        <div class="composer-row">
          <textarea
            id="message-input"
            name="message"
            rows="3"
            placeholder="写下你想问的问题……"
          ></textarea>
          <button id="send-button" class="primary-button" type="submit">发送</button>
        </div>
        <p id="page-feedback" class="page-feedback" aria-live="polite"></p>
      </form>
    </main>

    <script src="app.js"></script>
  </body>
</html>
