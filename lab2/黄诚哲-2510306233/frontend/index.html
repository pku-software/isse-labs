<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <h1>AI 聊天</h1>
    </header>

    <main class="chat-messages" id="messages">
      <!-- 聊天记录会显示在这里 -->
    </main>

    <section class="edit-area" id="edit-area" hidden>
      <input type="text" id="edit-input" placeholder="输入新的消息内容">
      <button id="edit-save">保存</button>
      <button id="edit-cancel">取消</button>
      <span class="edit-feedback" id="edit-feedback"></span>
    </section>

    <div class="status" id="status" hidden></div>

    <footer class="chat-input">
      <input type="text" id="message-input" placeholder="请输入消息…">
      <button id="send-button">发送</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
