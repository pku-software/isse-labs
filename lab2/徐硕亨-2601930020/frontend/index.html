<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天 Web 应用</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h2>AI 智能助手</h2>
            <div id="status-banner" class="status-banner">静态展示模式（未连接后端）</div>
        </header>

        <main id="chat-messages" class="chat-messages">
            <!-- 静态示例卡片展示结构 -->
            <div class="message-card" data-id="demo">
                <div class="message-bubble user-bubble">
                    <span class="sender-label">用户：</span>
                    <span class="message-text">这是一条示例消息</span>
                </div>
                <div class="message-bubble bot-bubble">
                    <span class="sender-label">AI：</span>
                    <span class="reply-text">你好！我是 AI 助手。</span>
                </div>
                <div class="card-actions">
                    <button class="btn-action btn-edit">修改</button>
                    <button class="btn-action btn-delete">删除</button>
                </div>
            </div>
        </main>

        <!-- 页面内修改表单容器（无浏览器弹窗） -->
        <div id="edit-modal" class="inpage-modal hidden">
            <div class="modal-content">
                <h3>修改消息</h3>
                <input type="text" id="edit-input" placeholder="输入新的消息内容...">
                <div class="modal-actions">
                    <button id="btn-save-edit" class="btn-primary">保存</button>
                    <button id="btn-cancel-edit" class="btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <footer class="chat-footer">
            <form id="chat-form" class="input-form">
                <input type="text" id="user-input" placeholder="输入您想问的问题..." autocomplete="off">
                <button type="submit" id="send-btn" class="btn-primary">发送</button>
            </form>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
