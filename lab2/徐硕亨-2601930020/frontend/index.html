<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天 Web 应用</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h2>AI 智能助手</h2>
            <div id="status-banner" class="status-banner">連線中...</div>
        </header>

        <main id="chat-messages" class="chat-messages">
            <!-- 聊天記錄將由 app.js 動態渲染 -->
        </main>

        <!-- 頁面內修改彈窗（無原生 alert / prompt） -->
        <div id="edit-modal" class="inpage-modal hidden">
            <div class="modal-content">
                <h3>修改消息</h3>
                <input type="text" id="edit-input" placeholder="輸入新的消息內容...">
                <div class="modal-actions">
                    <button id="btn-save-edit" class="btn-primary">保存</button>
                    <button id="btn-cancel-edit" class="btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <footer class="chat-footer">
            <form id="chat-form" class="input-form">
                <input type="text" id="user-input" placeholder="輸入您想問的問題..." autocomplete="off">
                <button type="submit" id="send-btn" class="btn-primary">發送</button>
            </form>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
