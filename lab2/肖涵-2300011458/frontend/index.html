<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 聊天室</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">个人实验项目</p>
          <h1>AI 聊天室</h1>
          <p class="subtitle">记录问题与回答，集中查看每一次交流。</p>
        </div>
        <span class="stage-badge">本地聊天记录</span>
      </header>

      <section class="chat-panel" aria-labelledby="history-title">
        <div class="panel-heading">
          <div>
            <h2 id="history-title">聊天记录</h2>
            <p>每条记录都可以修改或删除。</p>
          </div>
          <span class="record-count" id="record-count">0 条记录</span>
        </div>

        <div class="message-list" id="message-list" aria-live="polite">
          <p class="empty-state">正在加载聊天记录……</p>
        </div>
      </section>

      <section class="composer-panel" aria-labelledby="composer-title">
        <div class="panel-heading compact-heading">
          <div>
            <h2 id="composer-title">发送新消息</h2>
            <p>输入内容后发送，聊天记录会显示在上方。</p>
          </div>
        </div>
        <form class="composer-form" id="message-form">
          <label class="sr-only" for="message-input">消息内容</label>
          <textarea id="message-input" name="message" rows="4" placeholder="输入你想聊的内容"></textarea>
          <div class="composer-footer">
            <span class="form-note" id="form-status" role="status">输入消息后即可创建聊天记录。</span>
            <button type="submit" class="button button-primary" id="send-button">发送消息</button>
          </div>
        </form>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
