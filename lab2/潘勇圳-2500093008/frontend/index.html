<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 聊天</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">AI 聊天</h1>
        <p class="app__subtitle">输入一句话，看看 AI 怎么回答</p>
      </header>

      <!-- 聊天记录区域：每条记录包含用户消息、AI 回复，以及修改和删除入口 -->
      <section class="chat" aria-label="聊天记录">
        <article class="message">
          <div class="message__toolbar">
            <span class="message__index">#1</span>
            <div class="message__actions">
              <button type="button" class="button button--ghost">修改</button>
              <button type="button" class="button button--ghost">删除</button>
            </div>
          </div>
          <p class="bubble bubble--user">你好，帮我简单介绍一下北京。</p>
          <p class="bubble bubble--reply">这是后端的回复内容。</p>
        </article>

        <article class="message">
          <div class="message__toolbar">
            <span class="message__index">#2</span>
            <div class="message__actions">
              <button type="button" class="button button--ghost">修改</button>
              <button type="button" class="button button--ghost">删除</button>
            </div>
          </div>
          <p class="bubble bubble--user">再帮我推荐一本入门的书吧。</p>
          <p class="bubble bubble--reply">这是后端的回复内容。</p>
        </article>
      </section>

      <form class="composer">
        <input
          class="composer__input"
          type="text"
          name="message"
          placeholder="输入消息，按回车或点击发送"
          autocomplete="off"
        />
        <button class="button button--primary" type="submit">发送</button>
      </form>

      <p class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
