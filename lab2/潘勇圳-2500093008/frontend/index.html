<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 聊天</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">AI 聊天</h1>
        <p class="app__subtitle">输入一句话，看看 AI 怎么回答</p>
      </header>

      <!-- 聊天记录区域：内容由 app.js 调用 Flask 的 API 加载并渲染 -->
      <section class="chat" id="chat" aria-label="聊天记录"></section>
      <p class="empty" id="empty">还没有聊天记录，发一条消息试试。</p>

      <form class="composer" id="composer">
        <input
          class="composer__input"
          id="message-input"
          type="text"
          name="message"
          placeholder="输入消息，按回车或点击发送"
          autocomplete="off"
          maxlength="500"
        />
        <button class="button button--primary" id="send-button" type="submit">
          发送
        </button>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
