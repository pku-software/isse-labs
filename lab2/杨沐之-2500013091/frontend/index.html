<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天助手</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="chat-app">
      <header class="app-header">
        <p class="eyebrow">AI CHAT</p>
        <h1>AI 聊天助手</h1>
        <p>在这里记录问题与回答，稍后我们会把页面连接到 Flask 后端。</p>
      </header>

      <section class="chat-panel" aria-labelledby="messages-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">CONVERSATION</p>
            <h2 id="messages-title">聊天记录</h2>
          </div>
          <span class="status-badge" id="connection-status">正在连接</span>
        </div>

        <div class="message-list" id="message-list" aria-live="polite"></div>
      </section>

      <form class="composer" id="message-form" aria-labelledby="composer-title">
        <div>
          <p class="eyebrow">NEW MESSAGE</p>
          <h2 id="composer-title">发送消息</h2>
        </div>
        <label for="message-input">你的问题</label>
        <textarea
          id="message-input"
          name="message"
          rows="4"
          placeholder="输入想问 AI 的内容……"
        ></textarea>
        <div class="composer-footer">
          <p class="form-feedback" id="form-feedback" role="status">输入消息后点击发送。</p>
          <button type="submit" class="primary-button" id="send-button">发送</button>
        </div>
      </form>
    </main>

    <script src="app.js"></script>
  </body>
</html>
