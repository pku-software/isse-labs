<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天助手</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">AI CHAT</p>
          <h1>AI 聊天助手</h1>
          <p class="subtitle">一个简洁的问答工作台</p>
        </div>
        <span class="status-badge" id="connection-status">正在连接</span>
      </header>

      <section class="chat-panel" aria-label="聊天记录">
        <div class="message-list" id="message-list" aria-live="polite">
          <p class="empty-state">正在加载聊天记录……</p>
        </div>

        <p class="page-feedback" id="page-feedback" role="status"></p>

        <form class="composer" id="message-form" novalidate>
          <label class="sr-only" for="message-input">输入消息</label>
          <textarea
            id="message-input"
            name="message"
            rows="2"
            placeholder="输入你的问题……"
          ></textarea>
          <button class="send-button" id="send-button" type="submit">发送</button>
        </form>
      </section>
    </main>
  </body>
</html>
