<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 聊天</title>
    <link rel="stylesheet" href="/frontend/style.css" />
    <script src="/frontend/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">CHAT SPACE</p>
          <h1>AI 聊天</h1>
          <p class="subtitle">在这里开启一段对话</p>
        </div>
        <span class="status-badge">本地聊天</span>
      </header>

      <section class="conversation" aria-label="聊天记录">
        <div class="conversation-heading">
          <h2>聊天记录</h2>
          <span>每次问答保存为一条记录</span>
        </div>

        <div id="message-list" class="message-list" aria-live="polite"></div>
      </section>

      <form class="composer" id="message-form">
        <label for="message-input">发送消息</label>
        <div class="composer-row">
          <textarea id="message-input" name="message" rows="2" placeholder="输入你想说的话……" required></textarea>
          <button class="send-button" type="submit">发送</button>
        </div>
        <p id="feedback" class="composer-hint" role="status" aria-live="polite"></p>
      </form>
    </main>
  </body>
</html>
