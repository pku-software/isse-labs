<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 聊天</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">本地聊天</p>
        <h1>AI 聊天</h1>
      </div>
      <p id="status" class="status">正在加载聊天记录。</p>
    </header>

    <section id="chat" class="chat" aria-label="聊天记录"></section>

    <form id="composer" class="composer">
      <label class="composer-label" for="message-input">消息</label>
      <textarea id="message-input" rows="3" placeholder="输入要发送的内容"></textarea>
      <div class="composer-bar">
        <p id="feedback" class="feedback"></p>
        <button type="submit">发送</button>
      </div>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
