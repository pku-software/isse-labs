[server]
http_addr = 127.0.0.1
http_port = 3000

[paths]
data = ${LAB4_GRAFANA_DATA}
logs = ${LAB4_GRAFANA_LOGS}
plugins = ${LAB4_GRAFANA_PLUGINS}
provisioning = ${LAB4_GRAFANA_PROVISIONING}

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
disable_initial_admin_creation = true
disable_gravatar = true

[auth]
disable_login_form = true

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
allow_sign_up = false
default_theme = light

[dashboards]
min_refresh_interval = 2s
default_home_dashboard_path = ${LAB4_GRAFANA_HOME_DASHBOARD}

[plugins]
preinstall_disabled = true
public_key_retrieval_disabled = true

[log]
mode = console file
level = info
