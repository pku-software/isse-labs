[server]
http_addr = 127.0.0.1
http_port = 3001
root_url = http://127.0.0.1:3001/

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[auth.anonymous]
enabled = true
org_role = Viewer

[users]
allow_sign_up = false
default_theme = light
default_language = zh-Hans

[dashboards]
min_refresh_interval = 2s

[plugins]
preinstall_disabled = true
public_key_retrieval_disabled = true
disable_plugins = elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,alertmanager,grafana-azure-monitor-datasource,cloudwatch,grafana-testdata-datasource,graphite

[log]
mode = file
level = info
