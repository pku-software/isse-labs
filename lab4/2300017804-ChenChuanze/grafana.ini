[paths]
data = ${LAB4_ROOT}/.runtime/grafana/data
logs = ${LAB4_ROOT}/.runtime/grafana/logs
plugins = ${LAB4_ROOT}/.runtime/grafana/plugins
provisioning = ${LAB4_ROOT}/grafana/provisioning

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = 127.0.0.1
root_url = http://127.0.0.1:3000/

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

# This isolated teaching instance is reachable only on this computer.
# Configuration is provisioned from files; anonymous access is read-only.
[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
allow_sign_up = false
default_theme = light

[dashboards]
min_refresh_interval = 2s
default_home_dashboard_path = ${LAB4_ROOT}/grafana-dashboard.json

[plugins]
preinstall_disabled = true

[log]
mode = console file
level = info
