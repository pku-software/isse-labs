# 本实验专用的 Grafana 配置：数据、日志、插件和 provisioning 都放在个人目录内，
# 服务只监听本机，避免把文件写到用户漫游目录或其他实验目录。

[server]
http_addr = 127.0.0.1
http_port = 3000

[paths]
data = C:/Users/我不是宋荣子/isse-labs/lab4/2400018614-xiaoshadi/.runtime/grafana/data
logs = C:/Users/我不是宋荣子/isse-labs/lab4/2400018614-xiaoshadi/.runtime/grafana/logs
plugins = C:/Users/我不是宋荣子/isse-labs/lab4/2400018614-xiaoshadi/.runtime/grafana/plugins
provisioning = C:/Users/我不是宋荣子/isse-labs/lab4/2400018614-xiaoshadi/provisioning

[analytics]
reporting_enabled = false
check_for_updates = false

# 只在本机做课程演示，允许匿名访问以省去首次登录改密码的步骤
[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Admin

[users]
allow_sign_up = false
