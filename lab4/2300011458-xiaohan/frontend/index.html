<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 聊天室</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">个人实验项目</p>
          <h1>AI 聊天室</h1>
          <p class="subtitle">创建多个会话，在各自的上下文中继续交流。</p>
        </div>
        <span class="stage-badge">多会话聊天</span>
      </header>

      <div class="workspace-grid">
        <aside class="conversation-panel" aria-labelledby="conversation-title">
          <div class="panel-heading compact-heading">
            <div>
              <h2 id="conversation-title">聊天会话</h2>
              <p>选择一个会话继续聊天。</p>
            </div>
          </div>

          <form class="conversation-form" id="conversation-form">
            <label class="sr-only" for="conversation-input">新会话名称</label>
            <input id="conversation-input" type="text" placeholder="输入新会话名称" maxlength="60" />
            <button type="submit" class="button button-primary">创建会话</button>
          </form>

          <div class="conversation-list" id="conversation-list" aria-live="polite">
            <p class="empty-state">正在加载会话……</p>
          </div>
        </aside>

        <div class="chat-workspace">
          <section class="chat-panel" aria-labelledby="history-title">
            <div class="panel-heading">
              <div>
                <h2 id="history-title">请选择一个会话</h2>
                <p id="history-description">创建或选择会话后即可开始聊天。</p>
              </div>
              <span class="record-count" id="record-count">0 轮对话</span>
            </div>

            <div class="message-list" id="message-list" aria-live="polite">
              <p class="empty-state">当前没有选中的会话。</p>
            </div>
          </section>

          <section class="composer-panel" aria-labelledby="composer-title">
            <div class="panel-heading compact-heading">
              <div>
                <h2 id="composer-title">发送新消息</h2>
                <p>后端会把当前会话历史连同新问题发送给模型。</p>
              </div>
            </div>
            <form class="composer-form" id="message-form">
              <label class="sr-only" for="message-input">消息内容</label>
              <textarea id="message-input" name="message" rows="4" placeholder="先创建或选择一个会话" disabled></textarea>
              <div class="composer-footer">
                <span class="form-note" id="form-status" role="status">请先创建或选择会话。</span>
                <button type="submit" class="button button-primary" id="send-button" disabled>发送消息</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
