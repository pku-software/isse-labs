[paths]
data = $__env{LAB4_PROJECT_DIR}/.runtime/grafana/data
logs = $__env{LAB4_PROJECT_DIR}/.runtime/grafana/logs
plugins = $__env{LAB4_PROJECT_DIR}/.runtime/grafana/plugins
provisioning = $__env{LAB4_PROJECT_DIR}/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
root_url = http://127.0.0.1:3000/

[database]
type = sqlite3
path = $__env{LAB4_PROJECT_DIR}/.runtime/grafana/data/grafana.db

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[log]
mode = console file
