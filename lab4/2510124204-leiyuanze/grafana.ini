#################################### Paths ####################################
# 本文件由 start-grafana.ps1 使用：--config grafana.ini --homepath .tools/grafana
# 运行数据固定写在个人目录的 .runtime/grafana 下（不提交）。
[paths]
data = D:/leiyuanze/0courses/大二上/智能化软件系统与工程/isse-labs/lab4/2510124204-leiyuanze/.runtime/grafana/data
logs = D:/leiyuanze/0courses/大二上/智能化软件系统与工程/isse-labs/lab4/2510124204-leiyuanze/.runtime/grafana/logs
plugins = D:/leiyuanze/0courses/大二上/智能化软件系统与工程/isse-labs/lab4/2510124204-leiyuanze/.runtime/grafana/plugins
provisioning = D:/leiyuanze/0courses/大二上/智能化软件系统与工程/isse-labs/lab4/2510124204-leiyuanze/grafana/provisioning

#################################### Server ###################################
[server]
http_addr = 127.0.0.1
http_port = 3000
domain = localhost

#################################### Security ################################
[security]
admin_user = admin
admin_password = admin
disable_gravatar = true

[users]
default_theme = light

#################################### Anonymous Auth ##########################
[auth.anonymous]
enabled = true
org_role = Admin

#################################### Logging ##################################
[log]
mode = file
level = info

#################################### Analytics ################################
[analytics]
reporting_enabled = false
check_for_updates = false

[snapshots]
external_enabled = false