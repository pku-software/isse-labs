name: Chat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        run: |
          /opt/homebrew/Caskroom/miniconda/base/envs/isse-lab2/bin/python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python --version
          .venv/bin/python -c 'import sys, platform; print(sys.executable); print(platform.machine())'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests and coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Run smoke test
        run: python scripts/smoke_test.py
