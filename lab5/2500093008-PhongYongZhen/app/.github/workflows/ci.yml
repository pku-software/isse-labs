name: Chat CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        run: |
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 --version
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m venv .venv-ci
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test and check coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Run smoke test
        run: python scripts/smoke_test.py
