<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 聊天</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <span class="eyebrow">LAB 2 · AI CHAT</span>
        <h1>开始一段对话</h1>
        <p>在这里提问、查看回复，并管理每一次问答。</p>
      </header>

      <section class="chat-panel" aria-labelledby="history-title">
        <div class="section-heading">
          <h2 id="history-title">聊天记录</h2>
          <span class="count" id="message-count">0 条记录</span>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <section class="composer-panel" aria-labelledby="composer-title">
        <h2 id="composer-title">发送消息</h2>
        <form id="message-form">
          <label for="message-input">你的问题</label>
          <textarea id="message-input" rows="3" placeholder="输入你想问的问题……" required></textarea>
          <div class="composer-footer">
            <p id="status" role="status" aria-live="polite">准备就绪</p>
            <button type="submit" class="primary-button" id="send-button">发送</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
